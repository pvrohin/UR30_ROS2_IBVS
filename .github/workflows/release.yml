# Publishes the robot image for the Jetson when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The image is ghcr.io/<owner>/ur30_ibvs:<tag>, plus a sha-<commit> tag. Nothing deploys it:
# that is done by hand on the robot computer (docs/DEPLOYMENT.md, section 2).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  arm64-image:
    # A native arm64 runner, the same architecture as the Jetson: no emulation, so the C++
    # build takes minutes rather than an hour.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ur30_ibvs
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
