# MoveIt Servo parameters (schema of moveit_servo 2.12.x, Jazzy).
# Loaded flat and wrapped under the "moveit_servo" key by the launch file,
# same as moveit_servo's own demo_twist.launch.py.
#
# NOTE: ur_moveit_config's ur_servo.yaml targets an older schema (ee_frame,
# robot_link_command_frame, use_gazebo, ...) and is NOT used as the base here.

## Properties of outgoing commands
publish_period: 0.01  # [s] 100 Hz
max_expected_latency: 0.1  # [s]

## Properties of incoming commands
command_in_type: "speed_units"  # m/s and rad/s (schema default is "unitless")
scale:
  linear: 0.2  # [m/s] max linear speed, cap for the slow approach/servo
  rotational: 0.5  # [rad/s]
  joint: 0.5
# Commands older than this are discarded, so the sender must stamp with
# now() and publish faster than 1/timeout.
incoming_command_timeout: 0.1  # [s]
apply_twist_commands_about_ee_frame: true

## Outgoing command interface: velocities to forward_velocity_controller
# forward_velocity_controller is a ForwardCommandController with
# interface_name: velocity, so it takes std_msgs/Float64MultiArray on
# <controller>/commands.
command_out_type: std_msgs/Float64MultiArray
command_out_topic: /forward_velocity_controller/commands
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false

## Smoothing (needs joint acceleration limits from joint_limits.yaml, and the
## update_period / planning_group_name params passed by the launch file)
use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

## No move_group runs in this setup, so Servo owns the planning scene
is_primary_planning_scene_monitor: true
check_octomap_collisions: false

## MoveIt properties
move_group_name: ur_manipulator

## Singularity / joint limit handling
lower_singularity_threshold: 100.0
hard_stop_singularity_threshold: 200.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.1]  # size 1 applies to all joints

## Topics
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status

## Collision checking is OFF for now. The URDF contains the pedestal, table,
## door panel and camera links, but the reused UR SRDF only disables collision
## pairs for the arm itself, so those extra links would report permanent
## self-collisions and Servo would refuse to move. TODO: add a cell-specific
## SRDF with the right disabled pairs, then enable this.
check_collisions: false
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
collision_check_rate: 10.0
