# Laptop overrides: build the image locally instead of pulling it, replace the arm with
# ros2_control's mock hardware, and use the files shipped in the image instead of /etc/ur30,
# so the whole stack runs with no robot and nothing installed on the laptop. From here:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build robot ibvs
# with a .env copied from .env.example and IMAGE_TAG=dev in it.
# Without a camera, the ibvs node waits for camera_info; with one, it stops in IDLE, because the
# shipped template has site_configured: false.
# ROS tools on this same computer only see the containers with FASTDDS_BUILTIN_TRANSPORTS=UDPv4
# set (and `ros2 daemon stop` once): see docs/DEPLOYMENT.md, section 2.

x-dev: &dev
  image: ur30_ibvs:dev
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: runtime

services:
  camera:
    <<: *dev
  robot:
    <<: *dev
    restart: "no"
    volumes: !reset []
    command: >
      ros2 launch ur30_real_bringup robot.launch.py
      robot_ip:=${ROBOT_IP:-127.0.0.1}
      use_mock_hardware:=true
  ibvs:
    <<: *dev
    volumes: !reset []
    command: >
      ros2 launch ur30_ibvs ibvs_node.launch.py
      params_file:=/ws/install/ur30_real_bringup/share/ur30_real_bringup/config/ur30_ibvs_real.yaml
